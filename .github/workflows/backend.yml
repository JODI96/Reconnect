name: Backend

on:
  push:
    branches: [main]
    paths-ignore: ["client/**", "**.md"]
  pull_request:
    paths-ignore: ["client/**", "**.md"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Reconnect.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build Reconnect.slnx --no-restore -c Release

      - name: Every module migration is up to date
        run: |
          for project in src/Modules/*/*/*.csproj; do
            echo "Checking $project"
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --no-build --configuration Release
          done

      - name: Unit and architecture tests
        run: |
          dotnet test tests/Reconnect.UnitTests --no-build --configuration Release
          dotnet test tests/Reconnect.ArchitectureTests --no-build --configuration Release

      # Testcontainers starts PostGIS and Redis with the runner's Docker.
      - name: Integration tests
        run: dotnet test tests/Reconnect.Api.Tests --no-build --configuration Release
